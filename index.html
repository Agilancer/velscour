<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>VELSCOUR</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/ui/icon.png">
<link rel="apple-touch-icon" href="assets/ui/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div id="hud-top-left">
      <div id="area-name"></div>
      <div id="area-sub"></div>
      <div id="hero-stats">
        <div class="hs-row"><span>Level</span><b id="hs-lvl"></b></div>
        <div class="hs-row"><span>Attack</span><b id="hs-atk"></b></div>
        <div class="hs-row"><span>DPS</span><b id="hs-dps"></b></div>
        <div class="hs-row hs-avg"><span>Avg DPS &middot; 30s</span><b id="hs-avg"></b></div>
        <canvas id="hs-spark" width="150" height="18"></canvas>
      </div>
      <div id="buff-row"></div>
      <div id="auto-status" class="hidden"></div>
    </div>
    <div id="hud-top-right">
      <canvas id="minimap" width="180" height="180"></canvas>
      <div id="hud-buttons">
        <button class="hbtn" data-act="inventory" title="Inventory (I)">&#9881;<span>Bag</span></button>
        <button class="hbtn" data-act="skills" title="Skill Tree (K)">&#10022;<span>Skills</span><b id="sp-badge" class="badge hidden"></b></button>
        <button class="hbtn" data-act="book" title="Skill Book (B)">&#9776;<span>Book</span></button>
        <button class="hbtn" data-act="character" title="Character (C)">&#9876;<span>Hero</span><b id="stat-badge" class="badge hidden"></b></button>
        <button class="hbtn" data-act="auto" id="auto-btn" title="Auto-play (P): the hero plays on autopilot">&#9654;<span>Auto</span></button>
        <button class="hbtn" data-act="menu" title="Menu (Esc)">&#9776;<span>Menu</span></button>
      </div>
    </div>
    <div id="boss-bar" class="hidden"><div id="boss-name"></div><div id="boss-track"><div id="boss-fill"></div></div><div id="boss-sub"></div></div>
    <div id="center-msg"></div>
    <div id="levelup" class="hidden">
      <div class="lu-flash"></div>
      <div class="lu-burst"><div></div></div>
      <div class="lu-title">Level Up</div>
      <div class="lu-level"><span>Level</span><b id="lu-num"></b></div>
      <div class="lu-sub">+5 attribute points &middot; +1 skill point</div>
      <div class="lu-voice"><div id="lu-l1"></div><div id="lu-l2"></div></div>
    </div>
    <div id="log"></div>
    <div id="hud-bar">
      <div id="xp-track"><div id="xp-fill"></div></div>
      <img id="hud-img" src="assets/ui/hud.webp" alt="" draggable="false">
      <div class="orb-cover" id="life-cover"><div class="orb-empty"></div></div>
      <div class="orb-cover" id="mana-cover"><div class="orb-empty"></div></div>
      <div class="orb-text" id="life-text"></div>
      <div class="orb-text" id="mana-text"></div>
      <div id="xp-text"></div>
      <div id="hud-slots"></div>
    </div>
  </div>

  <!-- Touch controls -->
  <div id="touch-ui" class="hidden">
    <div id="joy-base"><div id="joy-knob"></div></div>
    <div id="touch-buttons"></div>
  </div>

  <div id="panels"></div>
  <div id="screens"></div>
  <div id="tooltip" class="hidden"></div>
  <div id="drag-ghost" class="hidden"></div>
  <div id="rotate-hint" class="hidden">
    <div>&#10227;</div>
    <p>Turn your device sideways for the best experience.</p>
    <button class="btn" id="rotate-dismiss">Play anyway</button>
  </div>
  <div id="loading"><div class="spinner"></div><div id="loading-text">Summoning the depths&hellip;</div></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
