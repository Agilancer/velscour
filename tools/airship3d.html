<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airship 3D</title>
<!-- The airship (tools/airship3d.js) over a blue sky, seen from the game's iso camera with the bow to the upper right.
     Clouds and wind are 2D canvases behind and in front of the three.js view. Only this tool runs three.js.
     http://localhost:8123/tools/airship3d.html  (?px=1|2|3 pixel size, ?figures=0, ?grid=1, ?still=1 freezes the clock) -->
<style>
  html, body { margin: 0; height: 100%; background: #4f86d0; overflow: hidden; font: 12px monospace; color: #fff; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  #hud { position: fixed; left: 10px; top: 8px; text-shadow: 1px 1px 0 #0008; white-space: pre; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="gl"></canvas>
<canvas id="wind"></canvas>
<div id="hud"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { buildAirship, airshipMaterials, AIRSHIP } from './airship3d.js';

const Q = new URLSearchParams(location.search);
const opt = { px: +(Q.get('px') || 2), figures: Q.get('figures') !== '0', grid: Q.get('grid') === '1', wind: true, paused: false, still: Q.get('still') === '1' };
const HERO = 60 / Math.cos(Math.PI / 6) / (32 * Math.SQRT2);   // a 60 px hero in tile units (1.53)

// ------------------------------------------------------------------ three.js
const glc = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glc, alpha: true, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene();
const FH = 22;                                                     // half the view height, in tiles
const cam = new THREE.OrthographicCamera(-FH, FH, FH, -FH, -400, 400);
const TARGET = new THREE.Vector3(0, 1.5, -2);
function isoView() {
  const e = Math.PI / 6;
  cam.position.set(Math.cos(e) * Math.SQRT1_2, Math.sin(e), Math.cos(e) * Math.SQRT1_2).multiplyScalar(100).add(TARGET);
  cam.up.set(0, 1, 0); cam.zoom = 1; cam.lookAt(TARGET); cam.updateProjectionMatrix();
  controls.target.copy(TARGET); controls.update();
}
const controls = new OrbitControls(cam, glc);
controls.enablePan = true; controls.zoomSpeed = 1.2;

scene.add(new THREE.AmbientLight(0xffffff, 0.32 * Math.PI));
scene.add(new THREE.HemisphereLight(0xd4e6ff, 0x8aa6cc, 0.42 * Math.PI));   // blue above, cloud bounce below
const sun = new THREE.DirectionalLight(0xfff1dc, 1.2 * Math.PI);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, { left: -36, right: 36, top: 36, bottom: -36, near: 1, far: 220 });
scene.add(sun, sun.target);
{ // from the upper left, a little in front, as in the other 3D tools (camera space)
  isoView0();
  const d = new THREE.Vector3(-0.6, 0.85, 0.5).normalize().transformDirection(cam.matrixWorld);
  sun.position.copy(d).multiplyScalar(100); sun.target.position.set(0, 0, 0);
}
function isoView0() { const e = Math.PI / 6; cam.position.set(Math.cos(e) * Math.SQRT1_2, Math.sin(e), Math.cos(e) * Math.SQRT1_2).multiplyScalar(100); cam.lookAt(0, 0, 0); cam.updateMatrixWorld(); }

const M = await airshipMaterials();
const ship = buildAirship(M);
const bob = new THREE.Group(); bob.add(ship.root); scene.add(bob);

// glows: soft additive halos on lanterns and the keel crystals, a violet light under the hull
const halo = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, '#fff'); g.addColorStop(0.25, '#fff8'); g.addColorStop(1, '#fff0');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const glows = [];
for (const gl of ship.info.glow) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: halo, color: gl.c, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: gl.light ? 0.9 : 0.55 }));
  s.position.set(gl.x, gl.y, gl.z); s.scale.setScalar(gl.r); ship.root.add(s); glows.push(s);
  if (gl.light) { const p = new THREE.PointLight(0xa64dff, 26, 11, 1.6); p.position.set(gl.x, gl.y + 0.5, gl.z); ship.root.add(p); }
}

// scale figures: Air Pirates on deck, a boss on the quarterdeck (sprites at the game's 60 px hero size)
const figures = new THREE.Group(); ship.root.add(figures);
{
  const ld = new THREE.TextureLoader(), base = '../assets/source/air_pirates/';
  const put = async (file, x, z, frameH, figH, foot) => {
    const t = await ld.loadAsync(base + file); t.colorSpace = THREE.SRGBColorSpace; t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, alphaTest: 0.5 }));
    const h = HERO * Math.cos(Math.PI / 6) * frameH / 108;          // screen height of the frame, in tiles
    s.scale.set(h * t.image.width / t.image.height, h, 1); s.center.set(0.5, foot / frameH);
    s.position.set(x, AIRSHIP.deckAt(AIRSHIP.sAt(z)) + 0.02, z); figures.add(s);
  };
  const E = ['AIR-E001_tarcoat_deckhand', 'AIR-E002_saltwind_cutlass_raider', 'AIR-E004_boarding_pike_corsair', 'AIR-E006_gale_glass_harpooner',
    'AIR-E011_quartermaster_breaker', 'AIR-E018_shipbreaker_mauler', 'AIR-E021_iron_rib_captain_s_guard', 'AIR-E014_cinderbomb_grenadier'];
  const spots = [[-3, 3], [1.5, 4.5], [3.5, 0.5], [-1, -2], [-4, -5.5], [2, -7], [0, 6.5], [-2.5, -8.5]];
  await Promise.all(E.map((f, i) => put(`enemies/${f}.png`, spots[i][0], spots[i][1], 192, 100, 9)));
  await put('bosses/AIR-B001_admiral_veyl__the_black_sail_overlord.png', 0, AIRSHIP.zAt(0.11) - 1.2, 320, 192, 16);
}
figures.visible = opt.figures;

// tile grid on the walkable decks (whole tiles inside the bulwarks)
const grid = new THREE.Group(); ship.root.add(grid);
let tiles = 0;
{
  const pts = [], { inner, sAt, deckAt, zAt } = AIRSHIP;
  for (let z = Math.floor(zAt(1)); z < Math.ceil(zAt(0)); z++) for (let x = -7; x < 7; x++) {
    const s0 = sAt(z), s1 = sAt(z + 1), y = deckAt((s0 + s1) / 2);
    if (deckAt(s0) !== deckAt(s1 - 1e-6) && Math.abs(deckAt(s0) - deckAt(s1)) > 0) continue;
    const w = Math.min(inner(s0), inner(s1));
    if (x < -w || x + 1 > w || s1 < 0.005 || s0 > 0.995) continue;
    tiles++;
    const Y = y + 0.03;
    pts.push(x, Y, z, x + 1, Y, z, x + 1, Y, z, x + 1, Y, z + 1, x + 1, Y, z + 1, x, Y, z + 1, x, Y, z + 1, x, Y, z);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  grid.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x9cf7ff, transparent: true, opacity: 0.45 })));
}
grid.visible = opt.grid;

// ------------------------------------------------------------------ sky, clouds and wind (2D, pixel scale 3 / 2)
const skyc = document.getElementById('sky'), sx = skyc.getContext('2d');
const windc = document.getElementById('wind'), wx = windc.getContext('2d');
let W = 0, H = 0;
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(Math.ceil(W / opt.px), Math.ceil(H / opt.px), false);
  const a = W / H; cam.left = -FH * a; cam.right = FH * a; cam.top = FH; cam.bottom = -FH; cam.updateProjectionMatrix();
  skyc.width = Math.ceil(W / 3); skyc.height = Math.ceil(H / 3);
  windc.width = Math.ceil(W / 2); windc.height = Math.ceil(H / 2);
}
addEventListener('resize', resize);

const rnd = (a, b) => a + Math.random() * (b - a);
/** A pixel cloud: lit puffs from the upper left, three tones plus a highlight. */
function cloudSprite(w, h, tones) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  const puffs = [], n = Math.round(w / 9) + 3;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), r = h * (0.22 + 0.2 * Math.sin(Math.PI * t)) * rnd(0.8, 1.15);
    puffs.push([w * (0.12 + 0.76 * t) + rnd(-3, 3), h - r - rnd(1, h * 0.12), r]);
  }
  const pass = (col, dx, dy, k, op = 'source-over') => {
    x.globalCompositeOperation = op; x.fillStyle = col;
    for (const [px, py, r] of puffs) { x.beginPath(); x.arc(Math.round(px + dx * r), Math.round(py + dy * r), Math.max(1, r * k), 0, Math.PI * 2); x.fill(); }
  };
  pass(tones[0], 0, 0, 1);
  pass(tones[1], -0.12, -0.16, 0.86, 'source-atop');
  pass(tones[2], -0.25, -0.3, 0.6, 'source-atop');
  pass(tones[3], -0.38, -0.42, 0.28, 'source-atop');
  // hard alpha: pixel art edges
  const d = x.getImageData(0, 0, w, h); for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 100 ? 255 : 0; x.putImageData(d, 0, 0);
  return c;
}
const FAR = ['#86a9d6', '#a5c3e8', '#bed6f1', '#d3e5f8'], MID = ['#a9c4e6', '#d6e6f7', '#eef5fd', '#ffffff'];
const layers = [
  { n: 34, speed: 9, alpha: 0.85, make: () => cloudSprite(Math.round(rnd(40, 90)), Math.round(rnd(16, 30)), FAR) },
  { n: 16, speed: 22, alpha: 1, make: () => cloudSprite(Math.round(rnd(50, 120)), Math.round(rnd(20, 40)), MID) },
];
for (const L of layers) L.items = Array.from({ length: L.n }, () => ({ img: L.make(), u: Math.random(), v: Math.random() }));
const wisps = Array.from({ length: 3 }, () => ({ img: cloudSprite(Math.round(rnd(90, 160)), Math.round(rnd(30, 50)), MID), u: Math.random(), v: Math.random() }));

// the screen direction world +Z (bow to stern) moves in: the wind and the passing sky
const dir = { x: -0.894, y: 0.447 };
function windDir() {
  const a = new THREE.Vector3(0, 0, 0).project(cam), b = new THREE.Vector3(0, 0, 10).project(cam);
  let dx = (b.x - a.x) * W, dy = -(b.y - a.y) * H; const l = Math.hypot(dx, dy) || 1;
  if (l > 1e-3) { dir.x = dx / l; dir.y = dy / l; }
}
function drawSky(dt) {
  const w = skyc.width, h = skyc.height;
  const g = sx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#2f5fae'); g.addColorStop(0.55, '#5d93d8'); g.addColorStop(1, '#8fc2ef');
  sx.fillStyle = g; sx.fillRect(0, 0, w, h);
  for (const L of layers) {
    sx.globalAlpha = L.alpha;
    const pw = w + 240, ph = h + 120;
    for (const c of L.items) {
      c.u = (c.u + dir.x * L.speed * dt / pw + 1) % 1; c.v = (c.v + dir.y * L.speed * dt / ph + 1) % 1;
      sx.drawImage(c.img, Math.round(c.u * pw - 120), Math.round(c.v * ph - 60));
    }
  }
  sx.globalAlpha = 1;
}

// wind streaks: thin bright lines rushing past, some behind the ship and most in front
const streaks = [];
const spawn = (front) => ({ x: rnd(-0.1, 1.2), y: rnd(-0.2, 1.1), len: rnd(14, 46), speed: rnd(260, 520), life: 0, max: rnd(0.5, 1.3), a: rnd(0.25, 0.7), wob: rnd(0, 6), front });
for (let i = 0; i < 70; i++) { const s = spawn(i % 4 !== 0); s.life = rnd(0, s.max); streaks.push(s); }
function line(ctx, x0, y0, len, a) {   // a pixel line fading toward its tail
  for (let i = 0; i < len; i++) {
    const f = 1 - i / len; ctx.globalAlpha = a * f * Math.min(1, (len - i) / 4);
    ctx.fillRect(Math.round(x0 - dir.x * i), Math.round(y0 - dir.y * i), 1, 1);
  }
}
function drawWind(dt, t) {
  const w = windc.width, h = windc.height;
  wx.clearRect(0, 0, w, h);
  if (!opt.wind) return;
  const gust = 0.75 + 0.25 * Math.sin(t * 0.7) + 0.1 * Math.sin(t * 2.3);
  // fast wisps of cloud in front
  wx.globalAlpha = 0.2;
  for (const c of wisps) {
    const pw = w + 400, ph = h + 200;
    c.u = (c.u + dir.x * 140 * dt / pw + 1) % 1; c.v = (c.v + dir.y * 140 * dt / ph + 1) % 1;
    wx.drawImage(c.img, Math.round(c.u * pw - 200), Math.round(c.v * ph - 100), c.img.width * 2, c.img.height * 2);
  }
  wx.fillStyle = '#ffffff';
  for (const s of streaks) {
    s.life += dt;
    if (s.life > s.max) Object.assign(s, spawn(s.front));
    const k = s.life / s.max, fade = Math.sin(Math.PI * k);
    s.x += dir.x * s.speed * gust * dt / w; s.y += dir.y * s.speed * gust * dt / h;
    const px = s.x * w + Math.sin(t * 3 + s.wob) * 1.5 * -dir.y, py = s.y * h + Math.sin(t * 3 + s.wob) * 1.5 * dir.x;
    const ctx = s.front ? wx : sx;
    ctx.fillStyle = '#ffffff';
    if (s.front) line(ctx, px, py, s.len * gust, s.a * fade);
    else line(ctx, px * skyc.width / w, py * skyc.height / h, s.len * 0.6, s.a * fade * 0.8);
  }
  wx.globalAlpha = 1; sx.globalAlpha = 1;
}

// ------------------------------------------------------------------ loop + keys
const hud = document.getElementById('hud');
function info() {
  const i = ship.info;
  hud.textContent = `AIRSHIP  ${i.length.toFixed(0)} x ${i.beam.toFixed(0)} tiles (bowsprit to stern), main deck ${(i.mainDeck.z1 - i.mainDeck.z0).toFixed(0)} x ${i.mainDeck.width.toFixed(0)} clear + raised decks, ${tiles} walkable tiles\n`
    + `drag orbit · wheel zoom · right-drag pan · I iso view · P pixel ${opt.px}x · F figures · G grid · W wind · space ${opt.paused ? 'resume' : 'pause'}`;
}
addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'i') isoView();
  else if (k === 'p') { opt.px = opt.px % 3 + 1; resize(); }
  else if (k === 'f') figures.visible = !figures.visible;
  else if (k === 'g') grid.visible = !grid.visible;
  else if (k === 'w') opt.wind = !opt.wind;
  else if (k === ' ') opt.paused = !opt.paused;
  info();
});
resize(); isoView(); info();
let last = performance.now(), t = 0;
function frame(now) {
  const dt = opt.still ? 0 : Math.min(0.05, (now - last) / 1000); last = now;
  if (!opt.paused) t += dt;
  const d = opt.paused ? 0 : dt;
  bob.position.y = Math.sin(t * 0.7) * 0.28; bob.rotation.z = Math.sin(t * 0.5) * 0.012; bob.rotation.x = Math.sin(t * 0.6 + 1) * 0.008;
  ship.anim(t, d);
  glows.forEach((g, i) => { g.material.opacity = (g.scale.x > 3 ? 0.75 : 0.45) + 0.12 * Math.sin(t * 9 + i * 1.7); });
  windDir(); drawSky(d); drawWind(d, t);
  renderer.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/** Debug/test hook: look(x, y, z, zoom, azimuthDeg, elevationDeg) frames a point of the ship (defaults: the iso view). */
function look(x = TARGET.x, y = TARGET.y, z = TARGET.z, zoom = 1, az = 45, el = 30) {
  const a = az * Math.PI / 180, e = el * Math.PI / 180, p = new THREE.Vector3(x, y, z);
  cam.position.set(Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a)).multiplyScalar(100).add(p);
  cam.zoom = zoom; cam.lookAt(p); cam.updateProjectionMatrix(); controls.target.copy(p); controls.update();
}
window.AIRSHIP = { ship, scene, cam, renderer, opt, look };
</script>
</body>
</html>
