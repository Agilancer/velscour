<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bard's Songbook</title>
<!-- The Bard's sampler and sequencer outside the game: play the piano / harpsichord samples on a keyboard, and hear any
     of the 300 jingles written in a chosen rhythm and register, read off the staff by a playhead. Serve the repo root
     (python3 -m http.server 8123) and open /tools/songbook.html. -->
<style>
  :root { --bg: #120c16; --card: #1d1424; --ink: #f2e6c4; --dim: #a8988a; --gold: #ffd88a; --line: #3a2c40; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 Georgia, serif; }
  main { max-width: 1060px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 24px; color: var(--gold); margin: 4px 0 2px; }
  h2 { font-size: 16px; color: var(--gold); margin: 0 0 10px; }
  p.sub { color: var(--dim); margin: 0 0 14px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  select, input, button { font: inherit; background: #2a1e32; color: var(--ink); border: 1px solid #4a3a52; border-radius: 5px; padding: 5px 8px; }
  button { cursor: pointer; } button:hover { border-color: var(--gold); }
  button.go { background: #5a3a14; border-color: #a87a2a; }
  #status { color: var(--dim); }
  canvas#staff { width: 100%; height: auto; background: #f4ecd8; border-radius: 6px; display: block; }
  #info { color: var(--dim); margin-top: 8px; min-height: 1.4em; }
  .kb { position: relative; height: 150px; user-select: none; touch-action: none; overflow-x: auto; }
  .kb .w, .kb .b { position: absolute; top: 0; border: 1px solid #222; border-radius: 0 0 5px 5px; }
  .kb .w { background: #f6f0e2; height: 150px; z-index: 1; }
  .kb .b { background: #1a1418; height: 92px; z-index: 2; }
  .kb .on { background: var(--gold) !important; }
  .kb span { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 10px; color: #6a5a4a; pointer-events: none; }
</style>
</head>
<body>
<main>
  <h1>Bard's Songbook</h1>
  <p class="sub">The Bard's sampler and sequencer: 24 piano keys (C3–B4), 13 harpsichord keys (C4–C5), and 300 one-bar jingles.</p>
  <section>
    <div class="row"><button class="go" id="start">Start audio</button><span id="status">Audio is off until you press Start.</span></div>
  </section>
  <section>
    <h2>Sequencer</h2>
    <div class="row">
      <select id="jingle" aria-label="Jingle"></select>
      <button id="rand">Random</button>
    </div>
    <div class="row">
      <label>Register <select id="reg"></select></label>
      <label>Rhythm <select id="rhythm"></select></label>
      <button class="go" id="play">Play ▶</button>
      <button id="stop">Stop</button>
    </div>
    <canvas id="staff" width="2000" height="300"></canvas>
    <div id="info"></div>
  </section>
  <section>
    <h2>Keyboard</h2>
    <div class="row"><label>Instrument <select id="inst"><option value="piano">Piano</option><option value="harpsichord">Harpsichord</option></select></label>
      <span id="keyhint" style="color:var(--dim)">Tracker layout: Z S X D C V G B H N J M play C3–B3, Q 2 W 3 E R 5 T 6 Y 7 U play C4–B4, I plays C5.</span></div>
    <div class="kb" id="kb"></div>
  </section>
</main>
<script type="module">
import { initAudio } from '../src/core/audio.js';
import { loadInstruments, keysLoaded, playNote, playSequence, audioNow } from '../src/core/sampler.js';
import { JINGLES, keyName } from '../src/data/jingles.js';
import { NOTES, REGISTERS } from '../src/data/notation.js';
import { pitchHeads, bardArrangement } from '../src/game/bardmusic.js';
import { drawMeasure } from '../src/gfx/notation.js';

const $ = (id) => document.getElementById(id);
const RHYTHMS = {
  'Quarter notes': ['q', 'q', 'q', 'q'], 'Eighth pairs': ['e2', 'e2', 'e2', 'e2'], 'Sixteenths': ['s4', 's4', 's4', 's4'],
  'Eighth triplets': ['t8', 't8', 't8', 't8'], 'Half notes': ['h', 'h'], 'Whole note': ['w'],
  'Waltz-ish (q e e h)': ['q', 'e', 'e', 'h'], 'Gallop (e s s ×4)': ['e', 's2', 'e', 's2', 'e', 's2', 'e', 's2'],
  'Mixed (s4 t8 e s s q)': ['s4', 't8', 'e', 's', 's', 'q'], 'With rests (q rq e2 q)': ['q', 'rq', 'e2', 'q'],
  'Battle (random)': null,
};
const POOL = ['q', 'q', 'e', 'e2', 's', 's2', 's3', 's4', 't8', 't16', 'h', 'rq', 're'];
for (const j of JINGLES) $('jingle').add(new Option(`${String(j.id + 1).padStart(3, '0')} · ${j.name} · ${keyName(j.key)} · ♩=${j.tempo}`, j.id));
for (const [k, r] of Object.entries(REGISTERS)) $('reg').add(new Option(r.name, k));
for (const k of Object.keys(RHYTHMS)) $('rhythm').add(new Option(k, k));

let ready = false, seq = null, bar = null;
$('start').onclick = async () => {
  initAudio();
  $('status').textContent = 'Loading samples…';
  const n = await loadInstruments();
  ready = n > 0;
  $('status').textContent = ready ? `${n} samples loaded. Play the keyboard or a jingle.` : 'Could not load the samples.';
};

function glyphs(name) {
  const r = RHYTHMS[name];
  if (r) return r;
  const out = []; let left = 4;
  while (left > 1e-6) { const fit = POOL.filter((g) => NOTES[g].beats <= left + 1e-6); const g = fit[Math.floor(Math.random() * fit.length)] || 's'; out.push(g); left -= NOTES[g].beats; }
  return out;
}
/** Write the bar exactly as the Bard would: each glyph pitched from the jingle at its beat. */
function write() {
  const j = JINGLES[+$('jingle').value], reg = $('reg').value, sc = { jingle: j.id, notes: [], jst: { e: -1 } };
  let at = 0;
  for (const g of glyphs($('rhythm').value)) { sc.notes.push({ g, at, tier: 0, reg, heads: pitchHeads(sc, g, at, reg) }); at += NOTES[g].beats; }
  bar = { j, reg, notes: sc.notes, clef: reg === 'piano3' ? 'bass' : 'treble' };
  $('info').textContent = `${keyName(j.key)} · ${j.chords.map((c) => c.roman).join(' – ')} → ${j.key.minor ? 'i' : 'I'} · ♩ = ${j.tempo} · ${REGISTERS[reg].name}`;
  draw(-1);
}
function draw(play) {
  const c = $('staff'), x = c.getContext('2d');
  x.fillStyle = '#f4ecd8'; x.fillRect(0, 0, c.width, c.height);
  if (!bar) return;
  x.fillStyle = '#5a3a20'; x.font = 'italic 34px Georgia'; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.fillText(bar.j.name, 40, 52);
  drawMeasure(x, { x: 40, top: 120, w: 1920, u: 26, clef: bar.clef, key: bar.j.key, notes: bar.notes, col: '#1a1020', play, final: true,
    colOf: (n, lit) => (lit ? '#b0400a' : '#1a1020') });
}
function play() {
  if (!ready) { $('status').textContent = 'Press Start audio first.'; return; }
  if (seq) seq.stop(0.05);
  write();
  seq = playSequence(bardArrangement(bar.j, bar.notes, bar.clef), { bpm: bar.j.tempo });
  const s = seq, total = (4 + 2.5) * s.spb;
  const tick = () => { if (seq !== s) return; const b = (audioNow() - s.start) / s.spb; draw(b >= 0 && b <= 4.6 ? Math.min(4, b) : -1); if (audioNow() - s.start < total) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
$('play').onclick = play;
$('stop').onclick = () => { if (seq) seq.stop(0.08); seq = null; draw(-1); };
$('rand').onclick = () => { $('jingle').value = Math.floor(Math.random() * JINGLES.length); play(); };
for (const id of ['jingle', 'reg', 'rhythm']) $(id).onchange = write;
write();

// ---------------------------------------------------------------- keyboard synth, C3..C5
const kb = $('kb'), NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'], BLACK = [1, 3, 6, 8, 10];
const KEYMAP = 'zsxdcvgbhnjmq2w3er5t6y7ui'; // a tracker-style layout: C3 .. C5
const keyEls = {};
let wx = 0;
for (let m = 48; m <= 72; m++) {
  const pc = m % 12, black = BLACK.includes(pc), el = document.createElement('div');
  el.className = black ? 'b' : 'w';
  if (black) { el.style.left = (wx * 40 - 13) + 'px'; el.style.width = '26px'; }
  else { el.style.left = (wx * 40) + 'px'; el.style.width = '40px'; wx++; el.innerHTML = `<span>${NAMES[pc]}${Math.floor(m / 12) - 1}</span>`; }
  el.onpointerdown = (e) => { e.preventDefault(); hit(m); };
  kb.appendChild(el); keyEls[m] = el;
}
kb.style.width = (wx * 40 + 2) + 'px';
function hit(m) {
  if (!ready) { $('status').textContent = 'Press Start audio first.'; return; }
  playNote($('inst').value, m, { dur: 1.2, vel: 0.8 });
  const el = keyEls[m]; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 160);
}
window.addEventListener('keydown', (e) => {
  if (e.repeat || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  const i = KEYMAP.indexOf(e.key.toLowerCase());
  if (i >= 0) hit(48 + i);
});
</script>
</body>
</html>
