<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { tkeepLayout, TK } from '../src/world/tkeep.js';
import { TROPHY_ART } from '../src/data/keepart.js';

// World units: one screen px at 1x. A tile is 32*sqrt2 across (its edges project to 32 x 16 px), a level is 4 px up.
const TU = 32 * Math.SQRT2, LU = 4 / Math.cos(Math.PI / 6);

// ------------------------------------------------------------------ materials
const load = (src) => new Promise((ok, no) => new THREE.TextureLoader().load(src, ok, undefined, no));

  M.stone2 = await mk(T('stone2'), { color: 0xd0ccc4 });
  M.lime = await mk(T('lime'), { color: 0xd9d2c4, bump: 2.0 });
  M.plinth = await mk(T('plinth'), { color: 0xb8b2a8 });
  M.walk = await mk(T('flags'), { color: 0xb0b4bc, bump: 1.4 });   // the hall's own flagstones up on the balconies (the setts were dark noise at another scale)
  M.flags = await mk(T('flags'), { color: 0xc4c8d0, bump: 1.4 });
  M.carved = await mk(T('carved'), { color: 0xd0c9bb });
  M.tread = await mk(T('ashlar'), { color: 0xa6a094, bump: 2.4 });
  M.marble = await mk(T('ashlar'), { color: 0xb4aea2, bump: 2.2, rough: 0.7 });   // smooth pale ashlar (the chapel's carved marble read as scribbles on the plinth tops)
  M.slate = await mk(T('flags'), { color: 0x5a6070, bump: 1.4 });
  M.iron = await mk(C('iron'), { color: 0x9a9aa4 });
  M.ironDark = await mk(C('iron'), { color: 0x5a5660, rough: 0.6 });

  M.gold = await mk(T('lime'), { color: 0xc29a44, bump: 2.6, rough: 0.5 }); M.gold.metalness = 0.25; M.gold.emissive = new THREE.Color(0x1c1204);

  M.bronze = new THREE.MeshStandardMaterial({ color: 0x6e5226, roughness: 0.42, metalness: 0.7, emissive: 0x120c02, emissiveIntensity: 0.5 });
  M.coal = new THREE.MeshStandardMaterial({ color: 0x0a140a, roughness: 0.9, emissive: 0x1fa838, emissiveIntensity: 0.3 });

// ------------------------------------------------------------------ geometry
const V3 = (x, y, z) => new THREE.Vector3(x * TU, z * LU, y * TU);
function worldUV(g, rep) {

  g.computeVertexNormals();
  const p = g.attributes.position, n = g.attributes.normal, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) {
    const X = p.getX(i), Y = p.getY(i), Z = p.getZ(i), nx = n.getX(i), ny = n.getY(i), nz = n.getZ(i);
    if (Math.abs(ny) >= 0.7) { uv[i * 2] = X / rep; uv[i * 2 + 1] = Z / rep; }
    else if (Math.abs(nx) > Math.abs(nz)) { uv[i * 2] = Z / rep; uv[i * 2 + 1] = Y / rep; }

function boxGeo(x0, y0, x1, y1, z0, z1) {

}

}
/** A lathe of (r, z) points (tiles, levels) round (x, y). */

  const g = new THREE.LatheGeometry(pts.map(([r, z]) => new THREE.Vector2(Math.max(0.0001, r) * TU, z * LU)), seg);

}
/** A shape drawn on a wall face: local (s along the wall, z up) in tiles/levels, extruded `d` tiles out of the face. */

  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const s = p.getX(i), z = p.getY(i), d = p.getZ(i) + d0 * TU, o = c * TU + dir * d;

}
/** A lancet (pointed arch) outline of width w from z0 to the apex z1, round s = a (tiles, levels). */
function lancetPts(a, w, z0, z1, n = 10) {
  const hw = w / 2, spring = z1 - w * 1.05 * (TU / LU) * 0.5, pts = [[a - hw, z0]];
  for (let k = 0; k <= n; k++) { const t = k / n; pts.push([a - hw + hw * (1 - Math.cos(t * Math.PI / 2)) * 1, spring + (z1 - spring) * Math.sin(t * Math.PI / 2)]); }

}
const toShape = (pts, holes = []) => {

  for (const h of holes) sh.holes.push(new THREE.Path(h.map(([s, z]) => new THREE.Vector2(s * TU, z * LU))));

};
/** A round arch outline over [s0, s1] springing at `spring` (levels) for a blind arcade. */
function roundArchPts(s0, s1, z0, spring, n = 12) {
  const r = (s1 - s0) / 2, m = (s0 + s1) / 2, rise = r * TU / LU, pts = [[s0, z0]];

function build(M) {
  const buckets = new Map();

  for (let k = 0; k < 4; k++) {   // spokes and chains
    const a = (k + 0.25) / 4 * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    const rod = (x0, y0, z0, x1, y1, z1, t, m) => { const A = V3(x0, y0, z0), B = V3(x1, y1, z1), q = new THREE.CylinderGeometry(t * TU, t * TU, A.distanceTo(B), 6); q.translate(0, A.distanceTo(B) / 2, 0); q.applyQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize())); q.translate(A.x, A.y, A.z); geos[m].push(q); };
    rod(0, 0, 0.2, c, s, 0, 0.03, 'iron'); rod(c, s, 0, c * 0.55, s * 0.55, 3.2, 0.02, 'iron'); rod(c * 0.55, s * 0.55, 3.2, 0, 0, 12, 0.018, 'iron');
  }
  geos.gold.push(latheGeo(0, 0, [[0, -1.4], [0.1, -0.9], [0.2, -0.2], [0.12, 0.4], [0, 0.6]], 12));     // the boss under the ring
  geos.gold.push(latheGeo(0, 0, [[0, 11.6], [0.12, 12], [0.06, 12.8], [0, 13]], 10));
  geos.iron.push(cylGeo(0, 0, 0.034, 0.034, 13, 28, 6));                                                   // the chain up into the vault
  for (const [m, list] of Object.entries(geos)) { const mesh = new THREE.Mesh(mergeGeometries(list.map((q) => worldUV(q, 60))), m === 'gold' ? M.gold : m === 'iron' ? M.ironDark : M.tread); mesh.castShadow = mesh.receiveShadow = true; g.add(mesh); }
  g.userData.candles = candles.map(([x, y, z]) => [+((x - y) * 32).toFixed(1), +((x + y) * 16 - z * 4).toFixed(1)]);
  return g;
}
/** Fade a sprite's top rows out (a chain going up into the dark). */
function fadeTop(spr, rows) { for (let y = 0; y < Math.min(rows, spr.h); y++) for (let x = 0; x < spr.w; x++) spr.data[(y * spr.w + x) * 4 + 3] *= y / rows; return spr; }
const gltf = new GLTFLoader();
const loadGLB = (url) => new Promise((ok, no) => gltf.load(url, (g) => ok(g.scene), undefined, no));
/** A trophy model stood at the world origin: scaled to `size` tiles (its largest side, or its height with `tall`),
 *  turned by `yaw` degrees (0 faces the camera when the model faces +z), its base on the ground. */
function placeModel(root, o) {
  const holder = new THREE.Group(), inner = new THREE.Group();
  inner.add(root); holder.add(inner);
  if (o.pre) inner.rotation.set(...o.pre.map((d) => d * Math.PI / 180));
  inner.updateMatrixWorld(true);
  let bb = new THREE.Box3().setFromObject(inner), sz = bb.getSize(new THREE.Vector3());
  const k = (o.size * TU) / (o.tall ? sz.y : Math.max(sz.x, sz.y, sz.z));
  inner.scale.setScalar(k);
  inner.updateMatrixWorld(true);
  bb = new THREE.Box3().setFromObject(inner);
  const c = bb.getCenter(new THREE.Vector3());
  inner.position.set(-c.x, -bb.min.y, -c.z);
  holder.rotation.y = ((o.yaw ?? 0) + 45) * Math.PI / 180;   // +45: the camera looks down the (1, 1) diagonal
  root.traverse((m) => {
    if (!m.isMesh) return;
    m.castShadow = m.receiveShadow = true;
    if (m.material) { m.material = m.material.clone(); if (o.tint) m.material.color?.multiply(new THREE.Color(o.tint)); if (o.metal != null) m.material.metalness = o.metal; m.material.envMapIntensity = 0; }
  });
  return holder;
}

// ------------------------------------------------------------------ atlas pages
function pack(items, PAGE = 4096) {
  const order = items.map((u, i) => i).sort((a, b) => items[b].h - items[a].h), pages = [];
  let page = null, x = 0, y = 0, shelf = 0;
  const newPage = () => { page = document.createElement('canvas'); page.width = PAGE; page.height = 16; page._rows = []; pages.push(page); x = y = shelf = 0; };
  newPage();
  for (const i of order) {
    const u = items[i];
    if (x + u.w + 1 > PAGE) { x = 0; y += shelf + 1; shelf = 0; }
    if (y + u.h + 1 > PAGE) newPage();
    page._rows.push([u, x, y]); u.at = [pages.length - 1, x, y];
    x += u.w + 1; shelf = Math.max(shelf, u.h);
  }
  for (const p of pages) {
    p.height = Math.max(...p._rows.map(([u, , py]) => py + u.h)) + 1;
    const g = p.getContext('2d');
    for (const [u, px, py] of p._rows) g.putImageData(new ImageData(u.data, u.w, u.h), px, py);
  }
  return pages;
}

async function bakeAll(S = 1.5, SPR = 2, models = '../tools/tests/out/tkeep_src/') {
  const t0 = performance.now();
  setup();
  const M = await materials(), group = build(M);
  const pieces = bakePieces(group, S), front = bakeFront(group, S);
  const sprites = {}, items = [];
  for (const T of TROPHY_ART) {
    let root;
    try { root = await loadGLB(models + T.model); } catch (e) { console.warn('trophy model', T.id, T.model, e.message); continue; }
    const spr = bakeSprite(placeModel(root, T), SPR);
    if (!spr) continue;
    sprites['trophy_' + T.id] = { S: SPR, frames: [spr] }; items.push(spr);
  }
  const ch = chandelier(M), chs = fadeTop(bakeSprite(ch, SPR), 70);
  sprites.chandelier = { S: SPR, frames: [chs] }; items.push(chs);
  const all = [...pieces, ...items], pages = pack(all);
  const P = (u) => [u.at[0], u.at[1], u.at[2], u.w, u.h, +u.ox.toFixed(2), +u.oy.toFixed(2)];
  return {
    S, W: L.W, H: L.H,
    pages: pages.map((c) => c.toDataURL('image/png')),
    pieces: pieces.map(P), tiles: pieces.flatMap((u, i) => [u.tile, 0, i]),
    sprites: Object.fromEntries(Object.entries(sprites).map(([k, v]) => [k, { S: v.S, f: v.frames.map(P) }])),
    candles: ch.userData.candles, front,
    ms: Math.round(performance.now() - t0),
  };
}

/** One framed view of the whole keep (or a part: tile x, y at the centre), w x h px at S. */
async function preview(cx, cy, w = 1600, h = 1000, S = 0.6) {
  if (!renderer) setup();
  const M = await materials(), g = build(M);
  scene.add(g);
  const sx = (cx - cy) * 32, sy = (cx + cy) * 16 - 30 * 4, vw = w / S, vh = h / S;
  const cam = isoCamera(sx - vw / 2, sx + vw / 2, -(sy - vh / 2), -(sy + vh / 2));
  aimSun(cam);
  renderer.setSize(w, h, false); renderer.setClearColor(0x101014, 1); renderer.shadowMap.enabled = true;
  renderer.render(scene, cam);
  scene.remove(g);
  return renderer.domElement.toDataURL('image/png');
}
/** The trophies alone, in a row, for a look at their sizes and turns. */
async function trophySheet(models = '../tools/tests/out/tkeep_src/') {
  if (!renderer) setup();
  const out = [];
  for (const T of TROPHY_ART) {
    let root; try { root = await loadGLB(models + T.model); } catch (e) { out.push({ id: T.id, err: e.message }); continue; }
    const s = bakeSprite(placeModel(root, T), 2);
    if (!s) { out.push({ id: T.id, err: 'empty' }); continue; }
    const c = document.createElement('canvas'); c.width = s.w; c.height = s.h; c.getContext('2d').putImageData(new ImageData(s.data, s.w, s.h), 0, 0);
    out.push({ id: T.id, url: c.toDataURL('image/png'), w: s.w, h: s.h });
  }
  return out;
}
/** Debugging the cut: which tile a world point (tiles, level) is tagged to, and its colour, from the game camera. */
async function probe(x, y, z) {
  if (!renderer) setup();
  const M = await materials(), g = build(M);
  scene.add(g);
  const sx = (x - y) * 32, sy = (x + y) * 16 - z * 4, cam = isoCamera(sx - 8, sx + 8, -(sy - 8), -(sy + 8));
  aimSun(cam);
  const tag = renderPass(g, cam, 16, 16, true), col = renderPass(g, cam, 16, 16, false), k = (8 * 16 + 8) * 4;
  scene.remove(g);
  return { tag: [tag[k], tag[k + 1], tag[k + 2], tag[k + 3]], col: [col[k], col[k + 1], col[k + 2], col[k + 3]] };
}
/** Only the mask of the brazier's near half (bakeFront), at the pieces' scale: for a change to the brazier alone. */
async function bakeFrontOnly(S = 1.5) {
  if (!renderer) setup();
  return bakeFront(build(await materials()), S);
}
window.TKEEP = { bakeAll, bakeFrontOnly, preview, trophySheet, probe };
